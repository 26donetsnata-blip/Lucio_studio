<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2f8f6e" />
<title>Питание на 30 дней</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="stylesheet" href="./css/styles.css" />
</head>
<body>

<header class="app-header">
  <h1>Питание на 30 дней</h1>
  <button type="button" class="icon-btn" data-view="profile" onclick="switchView('profile')" aria-label="Профиль">⚙</button>
</header>

<main>

  <section class="view" data-view="today">
    <div class="day-nav">
      <button id="today-prev" class="icon-btn" aria-label="Предыдущий день">←</button>
      <h2 id="today-date">—</h2>
      <button id="today-next" class="icon-btn" aria-label="Следующий день">→</button>
    </div>

    <div id="today-meals" class="meal-list"></div>

    <div id="custom-entries" class="meal-list custom-entries-list"></div>

    <button type="button" id="add-custom-btn" class="add-custom-btn">+ Добавить свою запись</button>

    <div id="training-day-box" class="training-box" hidden>
      <h3>День силовой тренировки</h3>
      <p class="bonus-name"></p>
      <p class="bonus-note"></p>
      <p class="bonus-kcal"></p>
      <label class="checkbox-row">
        <input type="checkbox" id="workout-checkbox" />
        <span>Тренировка выполнена</span>
      </label>
    </div>

    <div class="lymph-box">
      <label class="checkbox-row">
        <input type="checkbox" id="lymphatic-checkbox" />
        <span>Лимфодренажная зарядка выполнена</span>
      </label>
    </div>

    <p id="today-totals" class="totals"></p>
  </section>

  <section class="view" data-view="week" hidden>
    <div class="day-nav">
      <button id="week-prev" class="icon-btn" aria-label="Предыдущая неделя">←</button>
      <h2 id="week-range">—</h2>
      <button id="week-next" class="icon-btn" aria-label="Следующая неделя">→</button>
    </div>
    <div id="week-days" class="week-list"></div>
  </section>

  <section class="view" data-view="shopping" hidden>
    <div class="day-nav">
      <button id="shopping-prev" class="icon-btn" aria-label="Предыдущая неделя">←</button>
      <h2 id="shopping-range">—</h2>
      <button id="shopping-next" class="icon-btn" aria-label="Следующая неделя">→</button>
    </div>
    <div id="shopping-list"></div>
  </section>

  <section class="view" data-view="progress" hidden>
    <h2>Прогресс</h2>
    <div class="progress-cards">
      <div class="progress-card"><span>Сегодня</span><strong id="progress-day">0%</strong></div>
      <div class="progress-card"><span>Эта неделя</span><strong id="progress-week">0%</strong></div>
      <div class="progress-card"><span>Весь план (30 дней)</span><strong id="progress-month">0%</strong></div>
    </div>
  </section>

  <section class="view" data-view="profile" hidden>
    <h2>Профиль и расчёт КБЖУ</h2>
    <div id="profile-info"></div>
  </section>

</main>

<nav class="tab-bar">
  <button class="tab-btn" data-view="today">Сегодня</button>
  <button class="tab-btn" data-view="week">Неделя</button>
  <button class="tab-btn" data-view="shopping">Покупки</button>
  <button class="tab-btn" data-view="progress">Прогресс</button>
</nav>

<div id="meal-modal" class="modal" hidden>
  <div class="modal-content">
    <button id="modal-close" class="icon-btn modal-close" aria-label="Закрыть">✕</button>
    <p class="modal-slot" id="modal-slot-label"></p>
    <h3 id="modal-meal-name"></h3>
    <p id="modal-meal-kcal" class="modal-kcal"></p>
    <h4>Ингредиенты</h4>
    <ul id="modal-ingredients"></ul>
    <h4>Приготовление</h4>
    <ol id="modal-steps"></ol>
    <h4>Заменить блюдо</h4>
    <div id="modal-alternatives" class="alt-list"></div>
  </div>
</div>

<div id="custom-modal" class="modal" hidden>
  <div class="modal-content">
    <button id="custom-modal-close" class="icon-btn modal-close" aria-label="Закрыть">✕</button>
    <h3>Своя запись</h3>
    <p class="modal-kcal">Впишите продукт и вес в граммах — калории и БЖУ посчитаются сами.</p>
    <form id="custom-form" class="custom-form">
      <label class="form-field">
        <span>Продукт</span>
        <input type="text" id="custom-name" list="food-datalist" placeholder="Например, гречка" required autocomplete="off" />
        <datalist id="food-datalist"></datalist>
      </label>
      <label class="form-field">
        <span>Вес, г</span>
        <input type="number" id="custom-grams" min="0" step="1" inputmode="numeric" placeholder="Например, 150" required />
      </label>

      <p id="custom-match-status" class="match-status"></p>
      <div id="custom-preview" class="custom-preview" hidden>
        <span class="preview-kcal mono"></span>
        <span class="preview-macros mono"></span>
      </div>

      <button type="button" id="custom-manual-toggle" class="link-btn">Продукта нет в списке — ввести калории/БЖУ вручную</button>

      <div id="custom-manual-fields" class="custom-manual-fields" hidden>
        <div class="form-row">
          <label class="form-field">
            <span>Белки, г</span>
            <input type="number" id="custom-protein" min="0" step="1" inputmode="numeric" />
          </label>
          <label class="form-field">
            <span>Жиры, г</span>
            <input type="number" id="custom-fat" min="0" step="1" inputmode="numeric" />
          </label>
          <label class="form-field">
            <span>Углеводы, г</span>
            <input type="number" id="custom-carb" min="0" step="1" inputmode="numeric" />
          </label>
        </div>
        <label class="form-field">
          <span>Калории</span>
          <div class="kcal-row">
            <input type="number" id="custom-kcal" min="0" step="1" inputmode="numeric" />
            <button type="button" id="custom-autofill-btn" class="link-btn">Посчитать из БЖУ</button>
          </div>
        </label>
      </div>

      <button type="submit" class="submit-btn">Добавить</button>
    </form>
  </div>
</div>

<script src="./js/food-db.js"></script>
<script src="./js/data.js"></script>
<script src="./js/nutrition-calc.js"></script>
<script src="./js/state.js"></script>
<script src="./js/plan-loader.js"></script>
<script src="./js/shopping-list.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
