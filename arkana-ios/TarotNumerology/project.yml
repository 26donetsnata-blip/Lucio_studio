name: TarotNumerology
options:
  bundleIdPrefix: com.tarotnumerology
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  TarotNumerology:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TarotNumerology
    info:
      path: TarotNumerology/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarotnumerology.app
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
