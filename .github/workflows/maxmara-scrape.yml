# Обход it.intrend.it без Claude: собирает Max Mara, пересобирает таблицу и пушит её.
name: Max Mara → обход Intrend

on:
  push:
    branches: [main]
    paths:
      - "maxmara/scrape-mode.txt"
  workflow_dispatch:
    inputs:
      mode:
        description: "probe — только проверка, dry — обход без пуша, run — обход и пуш"
        default: run

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mode
        id: m
        run: echo "mode=${{ inputs.mode || '' }}" >> $GITHUB_OUTPUT; if [ -z "${{ inputs.mode }}" ]; then echo "mode=$(cat maxmara/scrape-mode.txt 2>/dev/null || echo run)" >> $GITHUB_OUTPUT; fi
      - name: Probe
        if: steps.m.outputs.mode == 'probe'
        run: python3 maxmara/probe.py
