name: Build Arkana iOS

on:
  push:
    branches: [main]
    paths:
      - "arkana-ios/**"
      - ".github/workflows/build-arkana-ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: arkana-ios/TarotNumerology
    steps:
      - uses: actions/checkout@v4

      - name: Diagnostics
        run: |
          echo "::notice::$(xcodebuild -version | tr '\n' ' ')"
          echo "::notice::SDKs: $(xcodebuild -showsdks | grep -i simulator | tr '\n' ' | ')"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator SDK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild build \
            -project TarotNumerology.xcodeproj \
            -scheme TarotNumerology \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

      - name: Surface failure as annotations
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::xcodebuild failed (sdk=iphonesimulator), tail of build.log follows"
          tail -n 100 build.log | while IFS= read -r line; do
            safe=$(echo "$line" | sed 's/%/percent/g')
            echo "::error::${safe:0:250}"
          done
          exit 1
