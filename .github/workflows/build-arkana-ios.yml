name: Build Arkana iOS

on:
  push:
    branches: [main]
    paths:
      - "arkana-ios/**"
      - ".github/workflows/build-arkana-ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: arkana-ios/TarotNumerology
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version and available simulators
        run: |
          xcodebuild -version
          xcrun simctl list devicetypes | grep -i iphone || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project TarotNumerology.xcodeproj \
            -scheme TarotNumerology \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO
