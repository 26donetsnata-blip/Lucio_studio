# Винная подборка → Telegram, лично владельцу (первый адрес из TELEGRAM_CHAT_ID).
# Тот же бот и те же секреты, что у Max Mara.
name: Вино → Telegram (лично)

on:
  push:
    branches: [main]
    paths:
      - "wine/telegram.txt"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send to owner only
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          me=$(echo "$CHAT" | tr ',;' '  ' | awk '{print $1}')
          curl -sS -f "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${me}" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text@wine/telegram.txt" > /dev/null
          echo "Отправлено лично."
